name = "bm-share"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "bm-share"
# Placeholder UUID: `wrangler d1 create bm-share` prints the real id to paste here.
database_id = "00000000-0000-4000-8000-000000000000"

# The binding exists for head() only — verifying an upload actually landed.
# Uploads and downloads go through presigned URLs so no media bytes transit this
# worker; using BUCKET.put()/get() on media would undo that.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bm-matches"

# Required secrets (wrangler secret put ...):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#   SHARE_SECRET, DEVICE_SECRET
